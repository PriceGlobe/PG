<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0077B6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00B4D8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#90E0EF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="t" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8E53;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Globe -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#0D1B2A" stroke-width="2.5"/>

  <!-- Horizontal grid lines -->
  <ellipse cx="50" cy="32" rx="38" ry="9" fill="none" stroke="#00B4D8" stroke-width="1.5" opacity="0.5"/>
  <ellipse cx="50" cy="50" rx="44" ry="9" fill="none" stroke="#00B4D8" stroke-width="1.5" opacity="0.5"/>
  <ellipse cx="50" cy="68" rx="38" ry="9" fill="none" stroke="#00B4D8" stroke-width="1.5" opacity="0.5"/>
  <line x1="50" y1="5" x2="50" y2="95" stroke="#00B4D8" stroke-width="1.5" opacity="0.4"/>

  <!-- Price tag shapes -->
  <path d="M 32 38 L 45 25 L 60 25 L 60 38 L 52 47 L 42 38 Z" fill="url(#g)" opacity="0.85"/>
  <circle cx="45" cy="32" r="3" fill="white" opacity="0.7"/>

  <path d="M 48 52 L 62 38 L 75 38 L 75 52 L 68 62 L 57 52 Z" fill="url(#t)" opacity="0.85"/>
  <circle cx="62" cy="45" r="3" fill="white" opacity="0.7"/>

  <!-- $ % symbols -->
  <text x="30" y="72" font-family="Arial" font-size="14" font-weight="bold" fill="#2EC4B6" opacity="0.8">$</text>
  <text x="58" y="80" font-family="Arial" font-size="12" font-weight="bold" fill="#FF6B6B" opacity="0.8">%</text>
</svg>